<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zilmax Store</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: var(--tg-theme-bg-color, #111827);
            color: var(--tg-theme-text-color, #ffffff);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        .btn-main {
            background-color: var(--tg-theme-button-color, #3b82f6);
            color: var(--tg-theme-button-text-color, #ffffff);
        }
        .nav-active {
            color: var(--tg-theme-button-color, #3b82f6);
        }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden">
    <!-- Header -->
    <header class="p-4 border-b border-gray-700/50 flex justify-between items-center bg-gray-900/50 backdrop-blur-md sticky top-0 z-10">
        <h1 class="text-2xl font-bold tracking-tight">Zilmax</h1>
        <div class="flex items-center space-x-3">
            <button class="p-2 rounded-full hover:bg-gray-700/50 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 5.342 6 7.31 6 10v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
                </svg>
            </button>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 overflow-y-auto p-4 space-y-6 pb-24">
        <!-- Promo Banner -->
        <div class="relative rounded-2xl overflow-hidden bg-gradient-to-r from-blue-600 to-indigo-700 p-6 shadow-lg shadow-blue-900/20">
            <div class="relative z-10">
                <h2 class="text-3xl font-extrabold mb-2 text-white">Новая коллекция</h2>
                <p class="text-blue-100 mb-6 text-sm">Успей заказать лучшие товары бренда Zilmax со скидкой.</p>
                <button id="promo-btn" class="px-6 py-3 rounded-xl font-semibold bg-white text-blue-600 shadow-md hover:bg-gray-50 transition-all transform active:scale-95">
                    Смотреть
                </button>
            </div>
            <div class="absolute right-0 top-0 opacity-10 transform translate-x-8 -translate-y-8">
                <svg class="h-64 w-64" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.23-1.79L10 16v1c0 1.1.9 2 2 2v1.93zm9-1.93V18c0-1.1-.9-2-2-2h-1V9c0-1.66-1.34-3-3-3H7c-1.66 0-3 1.34-3 3v7h2c1.1 0 2 .9 2 2v1H7V9h8v7h-3v-2h2c1.1 0 2 .9 2 2z"/></svg>
            </div>
        </div>

        <!-- Catalog Title -->
        <h3 class="text-xl font-bold flex items-center justify-between">
            Популярные товары
            <span class="text-sm font-normal text-gray-400">Все товары (4)</span>
        </h3>

        <!-- Product Grid -->
        <div class="grid grid-cols-2 gap-4">
            <!-- Product Card 1 -->
            <div class="bg-gray-800/50 rounded-2xl overflow-hidden border border-gray-700/50 shadow-sm transition-all hover:border-gray-500">
                <div class="h-32 bg-gray-700 flex items-center justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" /></svg>
                </div>
                <div class="p-3">
                    <p class="font-semibold text-sm mb-1 line-clamp-1">Худи Zilmax Basic</p>
                    <p class="text-sm text-gray-400 mb-3">4 990 ₽</p>
                    <button class="w-full py-2 btn-main rounded-xl font-medium text-sm transition-transform active:scale-95">В корзину</button>
                </div>
            </div>

            <!-- Product Card 2 -->
            <div class="bg-gray-800/50 rounded-2xl overflow-hidden border border-gray-700/50 shadow-sm transition-all hover:border-gray-500">
                <div class="h-32 bg-gray-700 flex items-center justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" /></svg>
                </div>
                <div class="p-3">
                    <p class="font-semibold text-sm mb-1 line-clamp-1">Футболка Classic</p>
                    <p class="text-sm text-gray-400 mb-3">1 990 ₽</p>
                    <button class="w-full py-2 btn-main rounded-xl font-medium text-sm transition-transform active:scale-95">В корзину</button>
                </div>
            </div>

            <!-- Product Card 3 -->
            <div class="bg-gray-800/50 rounded-2xl overflow-hidden border border-gray-700/50 shadow-sm transition-all hover:border-gray-500">
                <div class="h-32 bg-gray-700 flex items-center justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" /></svg>
                </div>
                <div class="p-3">
                    <p class="font-semibold text-sm mb-1 line-clamp-1">Кепка Oversize</p>
                    <p class="text-sm text-gray-400 mb-3">1 590 ₽</p>
                    <button class="w-full py-2 btn-main rounded-xl font-medium text-sm transition-transform active:scale-95">В корзину</button>
                </div>
            </div>

            <!-- Product Card 4 -->
            <div class="bg-gray-800/50 rounded-2xl overflow-hidden border border-gray-700/50 shadow-sm transition-all hover:border-gray-500">
                <div class="h-32 bg-gray-700 flex items-center justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" /></svg>
                </div>
                <div class="p-3">
                    <p class="font-semibold text-sm mb-1 line-clamp-1">Шоппер Zilmax</p>
                    <p class="text-sm text-gray-400 mb-3">990 ₽</p>
                    <button class="w-full py-2 btn-main rounded-xl font-medium text-sm transition-transform active:scale-95">В корзину</button>
                </div>
            </div>
        </div>
    </main>

    <!-- Bottom Navigation -->
    <nav class="fixed bottom-0 left-0 right-0 p-3 bg-gray-900 border-t border-gray-700/50 backdrop-blur-md flex justify-around items-center z-20">
        <!-- Catalog Active -->
        <button class="flex flex-col items-center space-y-1 nav-active transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" /></svg>
            <span class="text-xs font-semibold">Каталог</span>
        </button>

        <!-- Cart Nav -->
        <button class="flex flex-col items-center space-y-1 text-gray-500 hover:text-gray-300 transition-colors relative">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" /></svg>
            <span class="text-xs font-medium">Корзина</span>
            <span class="absolute top-0 right-1 block h-2 w-2 rounded-full bg-blue-500"></span>
        </button>

        <!-- Profile Nav -->
        <button class="flex flex-col items-center space-y-1 text-gray-500 hover:text-gray-300 transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
            <span class="text-xs font-medium">Профиль</span>
        </button>

        <!-- Support Nav -->
        <button class="flex flex-col items-center space-y-1 text-gray-500 hover:text-gray-300 transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636a9 9 0 11-12.728 0m12.728 0A9 9 0 005.636 18.364m12.728 0L5.636 5.636" /></svg>
            <span class="text-xs font-medium">Поддержка</span>
        </button>
    </nav>

    <script>
        // Инициализация Telegram WebApp
        if (window.Telegram && window.Telegram.WebApp) {
            const tg = window.Telegram.WebApp;
             tg.ready();
             tg.expand();
            
            // Настройка темы
            tg.enableClosingConfirmation();
            
            const promoBtn = document.getElementById('promo-btn');
            promoBtn.addEventListener('click', () => {
                tg.HapticFeedback.impactOccurred('medium');
                 tg.showAlert('Все товары Zilmax уже перед вами!');
            });
        }
    </script>
</body>
</html>
